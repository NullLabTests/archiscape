[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archiscape"
version = "0.1.0"
description = "Reverse-engineer Python codebases into interactive architecture knowledge graphs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NullLabTests", email = "nulllabtests@github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "networkx>=3.0",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/NullLabTests/archiscape"
Repository = "https://github.com/NullLabTests/archiscape"
Documentation = "https://github.com/NullLabTests/archiscape"
"Bug Tracker" = "https://github.com/NullLabTests/archiscape/issues"

[project.scripts]
archiscape = "archiscape.cli:app"

[tool.setuptools.packages.find]
include = ["archiscape*"]
